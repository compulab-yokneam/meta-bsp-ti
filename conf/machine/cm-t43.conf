#@TYPE: Machine
#@NAME: CompuLab CM-T43
#@DESCRIPTION: Machine configuration for the CompuLab CM-T43 module and SBC-T43 carrier

require conf/machine/include/ti43x.inc

# Keep compatibility with recipes that carry AM437x EVM-specific overrides.
MACHINEOVERRIDES =. "am437x-evm:"

# CM-T43 is supported by CompuLab's board-specific U-Boot tree.
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-compulab-cm-t43"
UBOOT_MACHINE = "cm_t43_defconfig"

MACHINE_FEATURES += "touchscreen"

SERIAL_CONSOLES = "115200;ttyS0"

# Include the CM-T43 deployment and U-Boot SPI update utilities in core images.
CORE_IMAGE_EXTRA_INSTALL += "cl-deploy cl-uboot"

# Build only the module and carrier-board device trees for this machine.
KERNEL_DEVICETREE_PREFIX = " \
    ti/omap/am437x-cm-t43 \
    ti/omap/am437x-sbc-t43 \
"

# Produce a compressed, directly flashable SD-card image and a tar rootfs.
IMAGE_FSTYPES = "wic.xz tar.bz2"
IMAGE_FSTYPES:remove = "tar.xz.md5sum"
WKS_FILE = "sdimage-2part.wks"

# The default CM-T43 U-Boot environment executes bootscr.img from partition 1.
# Give the kernel a board-specific name in the boot filesystem.
IMAGE_BOOT_FILES:remove = "zImage"
IMAGE_BOOT_FILES += "zImage-cm-t43 cm-t43-firmware bootscr.img"
do_image_wic[depends] += "cm-t43-bootscript:do_deploy"
